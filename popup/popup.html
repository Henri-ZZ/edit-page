<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Page</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div id="unsupportedPage" class="paywall hidden">
      <div class="paywall-icon">🚫</div>
      <h2 data-i18n="cannotEditThisPage">Cannot edit this page</h2>
      <p data-i18n="pageNotSupported">This page type is not supported</p>
    </div>

    <div id="mainContent">
      <div class="header">
        <h1>
          <img class="header-logo" src="../icons/icon48.png" alt="" aria-hidden="true">
          <span data-i18n="title">Edit Page</span>
          <img class="premium-badge" src="../assets/premium.png" alt="Premium">
        </h1>
        <div class="header-right">
          <span id="trialBadge" class="trial-badge"></span>
        </div>
      </div>
      <div class="content">
        <p class="section-label" data-i18n="chooseTool">Choose a tool</p>
        <div class="tool-list">
          <button id="editBtn" class="tool-button tool-button--text" type="button" aria-pressed="false">
            <span class="tool-icon" aria-hidden="true"><img src="../public/edit-text.svg" alt=""></span>
            <span class="tool-copy">
              <span id="editBtnLabel" class="tool-title" data-i18n="editText">Edit text</span>
              <span class="tool-description" data-i18n="editTextDesc">Change any text on this page</span>
            </span>
            <span class="tool-indicator" aria-hidden="true">›</span>
          </button>

          <div class="image-section expandable-tool">
            <button id="selectImageBtn" class="tool-button tool-button--image" type="button" aria-expanded="false" aria-controls="imageSourceOptions">
              <span class="tool-icon" aria-hidden="true"><img src="../public/replace-image.svg" alt=""></span>
              <span class="tool-copy">
                <span class="tool-title" data-i18n="changeImage">Change image</span>
                <span class="tool-description" data-i18n="changeImageDesc">Upload or paste an Image URL</span>
              </span>
              <span class="tool-indicator" aria-hidden="true">›</span>
            </button>
            <div id="imageSourceOptions" class="image-source-options hidden">
              <button id="uploadImageBtn" class="image-source-upload" type="button" data-i18n="uploadLocalImage">Upload from device</button>
              <div class="image-url-row">
                <input id="imageUrlInput" type="url" inputmode="url" autocomplete="url" spellcheck="false" placeholder="Paste Image URL" aria-label="Paste Image URL" data-i18n-placeholder="imageUrlPlaceholder" data-i18n-aria-label="imageUrlPlaceholder">
                <button id="useImageUrlBtn" type="button" data-i18n="useImageUrl">Use URL</button>
              </div>
            </div>
            <input type="file" id="imageInput" accept="image/*" hidden>
            <div id="imagePreview" class="image-preview hidden">
              <img id="previewImg" alt="Preview">
              <div class="image-preview-actions">
                <button id="replaceImageBtn" class="preview-action" type="button" aria-pressed="false">
                  <span id="replaceImageBtnLabel" data-i18n="replaceMode">Replace image mode</span>
                </button>
                <button id="clearImageBtn" class="clear-btn" type="button" data-i18n-aria-label="clearImage" aria-label="Clear selected image">×</button>
              </div>
            </div>
          </div>

          <button id="removeBtn" class="tool-button tool-button--remove" type="button" aria-pressed="false">
            <span class="tool-icon" aria-hidden="true"><img src="../public/remove-dom.svg" alt=""></span>
            <span class="tool-copy">
              <span id="removeBtnLabel" class="tool-title" data-i18n="removeElement">Remove element</span>
              <span class="tool-description" data-i18n="removeElementDesc">Click anything to remove it</span>
            </span>
            <span class="tool-indicator" aria-hidden="true">›</span>
          </button>

          <div class="screenshot-section expandable-tool">
            <button id="screenshotBtn" class="tool-button tool-button--screenshot" type="button" aria-expanded="false" aria-controls="screenshotOptions">
              <span class="tool-icon" aria-hidden="true"><img src="../public/screenshot.svg" alt=""></span>
              <span class="tool-copy">
                <span id="screenshotBtnLabel" class="tool-title" data-i18n="screenshot">Screenshot</span>
                <span class="tool-description" data-i18n="screenshotDesc">Capture the viewport or full page</span>
              </span>
              <span class="tool-indicator" aria-hidden="true">›</span>
            </button>
            <div id="screenshotOptions" class="screenshot-options hidden">
              <button id="visibleScreenshotBtn" class="screenshot-option" type="button">
                <span class="screenshot-option-icon" aria-hidden="true">▣</span>
                <span>
                  <strong id="visibleScreenshotLabel" data-i18n="visibleScreenshot">Current viewport</strong>
                </span>
              </button>
              <button id="fullPageScreenshotBtn" class="screenshot-option" type="button">
                <span class="screenshot-option-icon" aria-hidden="true">↕</span>
                <span>
                  <strong id="fullPageScreenshotLabel" data-i18n="fullPageScreenshot">Full page</strong>
                </span>
              </button>
              <div id="captureProgress" class="capture-progress hidden" role="status" aria-live="polite">
                <div class="capture-progress-track"><span id="captureProgressBar"></span></div>
                <span id="captureProgressText"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>
    <footer class="popup-footer">
      <a id="settingsBtn" href="#" data-i18n="settings">Settings</a>
    </footer>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
